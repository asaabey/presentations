<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="60" y="76" fill="#17324d" font-size="42" font-weight="700" text-anchor="start">Medicines that move lithium levels</text><text x="60" y="119" fill="#536779" font-size="23" font-weight="400" text-anchor="start">Direction of possible change; arrows do not represent effect size.</text><rect x="610" y="345" width="380" height="130" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="800.0" y="402.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Lithium</text><text x="800.0" y="436.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">serum concentration</text><rect x="60" y="195" width="450" height="100" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><text x="285.0" y="254.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Thiazide diuretics</text><path d="M520,245 L600,410" stroke="#bc7815" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="550" y="225" fill="#bc7815" font-size="34" font-weight="400" text-anchor="start">↑</text><rect x="60" y="345" width="450" height="100" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><text x="285.0" y="404.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">ACE inhibitors / ARBs</text><path d="M520,395 L600,410" stroke="#bc7815" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="550" y="375" fill="#bc7815" font-size="34" font-weight="400" text-anchor="start">↑</text><rect x="60" y="495" width="450" height="100" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><text x="285.0" y="554.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">NSAIDs, including COX-2</text><path d="M520,545 L600,410" stroke="#bc7815" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="550" y="525" fill="#bc7815" font-size="34" font-weight="400" text-anchor="start">↑</text><rect x="1090" y="240" width="450" height="110" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="1315.0" y="287.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">SGLT2 inhibitors</text><text x="1315.0" y="321.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">May lower lithium</text><path d="M1000,400 L1080,300" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1035" y="330" fill="#138b87" font-size="36" font-weight="400" text-anchor="start">↓</text><rect x="1090" y="485" width="450" height="110" rx="18" fill="#f5f8fa" stroke="none" stroke-width="2"/><text x="1315.0" y="532.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Amlodipine</text><text x="1315.0" y="566.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Usually minimal effect</text><path d="M1000,430 L1080,520" stroke="#536779" stroke-width="4" fill="none"/><rect x="120" y="690" width="1360" height="95" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="800.0" y="746.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Starting, stopping or changing an interacting medicine: arrange lithium monitoring.</text><text x="60" y="850" fill="#536779" font-size="18" font-weight="400" text-anchor="start">Sources: Medsafe, Drug Interactions with Lithium (2017); SGLT2 inhibitors and lithium (2023) • Original schematic</text></g></svg>