<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="60" y="76" fill="#17324d" font-size="42" font-weight="700" text-anchor="start">Three different questions for every drug</text><text x="60" y="119" fill="#536779" font-size="23" font-weight="400" text-anchor="start">Clearance, accumulation and kidney injury describe different processes.</text><rect x="60" y="170" width="470" height="555" rx="18" fill="#f5f8fa" stroke="none" stroke-width="2"/><text x="90" y="220" fill="#17324d" font-size="32" font-weight="700" text-anchor="start">Clearance</text><rect x="565" y="170" width="470" height="555" rx="18" fill="#f5f8fa" stroke="none" stroke-width="2"/><text x="595" y="220" fill="#17324d" font-size="32" font-weight="700" text-anchor="start">Accumulation</text><rect x="1070" y="170" width="470" height="555" rx="18" fill="#f5f8fa" stroke="none" stroke-width="2"/><text x="1100" y="220" fill="#17324d" font-size="32" font-weight="700" text-anchor="start">Nephrotoxicity</text><path d="M320,305 C210,250 165,445 275,475 C380,490 370,400 317,395 C270,389 271,350 320,345 Z" fill="#d4eeeb" stroke="#138b87" stroke-width="5"/><circle cx="100" cy="320" r="8" fill="#bc7815"/><circle cx="127" cy="320" r="8" fill="#bc7815"/><circle cx="154" cy="320" r="8" fill="#bc7815"/><path d="M185,360 L225,360" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M325,480 L325,540" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="295" y="580" fill="#17324d" font-size="25" font-weight="400" text-anchor="start">Urine</text><text x="90" y="655" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">How much drug leaves</text><text x="90" y="692" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">through the kidney?</text><rect x="610" y="300" width="380" height="160" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><circle cx="650" cy="340" r="8" fill="#bc7815"/><circle cx="677" cy="340" r="8" fill="#bc7815"/><circle cx="704" cy="340" r="8" fill="#bc7815"/><circle cx="731" cy="340" r="8" fill="#bc7815"/><circle cx="758" cy="340" r="8" fill="#bc7815"/><circle cx="650" cy="370" r="8" fill="#bc7815"/><circle cx="677" cy="370" r="8" fill="#bc7815"/><circle cx="704" cy="370" r="8" fill="#bc7815"/><circle cx="731" cy="370" r="8" fill="#bc7815"/><circle cx="758" cy="370" r="8" fill="#bc7815"/><circle cx="650" cy="400" r="8" fill="#bc7815"/><circle cx="677" cy="400" r="8" fill="#bc7815"/><circle cx="704" cy="400" r="8" fill="#bc7815"/><circle cx="731" cy="400" r="8" fill="#bc7815"/><circle cx="758" cy="400" r="8" fill="#bc7815"/><text x="800" y="510" fill="#17324d" font-size="23" font-weight="400" text-anchor="middle">Drug / metabolites in blood</text><text x="595" y="655" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">Reduced clearance can</text><text x="595" y="692" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">increase exposure and toxicity.</text><path d="M1320,305 C1210,250 1165,445 1275,475 C1380,490 1370,400 1317,395 C1270,389 1271,350 1320,345 Z" fill="#d4eeeb" stroke="#138b87" stroke-width="5"/><path d="M1140,355 L1210,355" stroke="#bb4148" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="1110" cy="350" r="8" fill="#bc7815"/><text x="1350" y="420" fill="#bb4148" font-size="66" font-weight="700" text-anchor="start">!</text><text x="1100" y="655" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">Does the drug cause</text><text x="1100" y="692" fill="#17324d" font-size="26" font-weight="400" text-anchor="start">kidney tissue injury?</text><text x="800" y="785" fill="#17324d" font-size="28" font-weight="600" text-anchor="middle">Accumulation can cause toxicity without directly damaging the kidney.</text><text x="60" y="850" fill="#536779" font-size="18" font-weight="400" text-anchor="start">Original schematic • Source: lesson.json, slide 2 • Not a quantitative model</text></g></svg>