<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="60" y="76" fill="#17324d" font-size="42" font-weight="700" text-anchor="start">Lithium: water handling and chronic injury</text><text x="60" y="119" fill="#536779" font-size="23" font-weight="400" text-anchor="start">The collecting-duct effect and chronic structural injury are distinct teaching points.</text><rect x="60" y="175" width="490" height="555" rx="18" fill="#f5f8fa" stroke="none" stroke-width="2"/><text x="90" y="220" fill="#17324d" font-size="29" font-weight="600" text-anchor="start">Simplified nephron</text><circle cx="180" cy="315" r="48" fill="#d4eeeb" stroke="#138b87" stroke-width="5"/><path d="M225 315 C360 240 380 390 290 400 L290 555 Q290 625 360 625 Q415 625 415 555 L415 350 L485 350 L485 660" fill="none" stroke="#138b87" stroke-width="17"/><text x="90" y="700" fill="#536779" font-size="21" font-weight="400" text-anchor="start">Schematic; anatomy not to scale</text><path d="M510,440 L610,440" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="635" y="195" width="900" height="90" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="1085.0" y="249.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Collecting-duct cell: lithium enters through ENaC</text><path d="M1085,290 L1085,330" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="635" y="345" width="900" height="100" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="1085.0" y="387.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Reduced response to ADH</text><text x="1085.0" y="421.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Less water reabsorbed</text><path d="M1085,450 L1085,495" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="635" y="510" width="900" height="85" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><text x="1085.0" y="561.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">More urine → polyuria / nephrogenic DI</text><rect x="635" y="645" width="900" height="120" rx="18" fill="#fbecee" stroke="none" stroke-width="2"/><text x="1085.0" y="697.0" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">Separate chronic effect</text><text x="1085.0" y="731.0" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">Tubulointerstitial injury over years to decades</text><text x="60" y="850" fill="#536779" font-size="18" font-weight="400" text-anchor="start">Source: Davis et al., BMC Nephrology 2018 • doi:10.1186/s12882-018-1101-4 • Original schematic</text></g></svg>