<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="60" y="76" fill="#17324d" font-size="42" font-weight="700" text-anchor="start">Calcineurin inhibitors: one mechanism, two dangers</text><text x="60" y="119" fill="#536779" font-size="23" font-weight="400" text-anchor="start">Tacrolimus and ciclosporin • CYP3A4 metabolism • Narrow therapeutic range</text><rect x="60" y="230" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="222.5" y="289.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Inhibitor</text><text x="222.5" y="323.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">added</text><path d="M395,297 L435,297" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="230" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="607.5" y="306.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">↓ metabolism</text><path d="M780,297 L820,297" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="830" y="230" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="992.5" y="289.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">↑ CNI</text><text x="992.5" y="323.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">exposure</text><path d="M1165,297 L1205,297" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1215" y="230" width="325" height="135" rx="18" fill="#fbecee" stroke="none" stroke-width="2"/><text x="1377.5" y="289.5" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">Toxicity</text><text x="1377.5" y="323.5" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">risk</text><rect x="60" y="470" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="222.5" y="529.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Inducer</text><text x="222.5" y="563.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">added</text><path d="M395,537 L435,537" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="470" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="607.5" y="546.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">↑ metabolism</text><path d="M780,537 L820,537" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="830" y="470" width="325" height="135" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="992.5" y="529.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">↓ CNI</text><text x="992.5" y="563.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">exposure</text><path d="M1165,537 L1205,537" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1215" y="470" width="325" height="135" rx="18" fill="#fbecee" stroke="none" stroke-width="2"/><text x="1377.5" y="529.5" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">Rejection</text><text x="1377.5" y="563.5" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">risk</text><text x="70" y="405" fill="#bc7815" font-size="24" font-weight="400" text-anchor="start">Stopping the inhibitor can lower CNI exposure.</text><text x="70" y="645" fill="#bc7815" font-size="24" font-weight="400" text-anchor="start">Stopping the inducer can raise CNI exposure.</text><rect x="60" y="700" width="1480" height="90" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="800.0" y="754.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Coordinate starting and stopping with the transplant team; agree a monitoring plan.</text><text x="60" y="850" fill="#536779" font-size="18" font-weight="400" text-anchor="start">Source: BC Transplant, Clinical Guidelines for Transplant Medications • Original mechanism schematic</text></g></svg>