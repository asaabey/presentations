<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="60" y="76" fill="#17324d" font-size="42" font-weight="700" text-anchor="start">Stacking QT risk in dialysis</text><text x="60" y="119" fill="#536779" font-size="23" font-weight="400" text-anchor="start">Medicine effects and electrolyte shifts can converge on cardiac electrical risk.</text><rect x="60" y="190" width="430" height="95" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="275.0" y="246.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Escitalopram</text><path d="M505,238 L760,420" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="330" width="430" height="95" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="275.0" y="386.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Quetiapine</text><path d="M505,378 L760,420" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="470" width="430" height="95" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="275.0" y="526.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Ondansetron</text><path d="M505,518 L760,420" stroke="#138b87" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="625" width="620" height="120" rx="18" fill="#fcefdc" stroke="none" stroke-width="2"/><text x="370.0" y="677.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Low potassium / low magnesium</text><text x="370.0" y="711.0" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Around dialysis</text><path d="M690,660 L800,490" stroke="#bc7815" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="800" y="315" width="670" height="200" rx="18" fill="#fbecee" stroke="none" stroke-width="2"/><text x="1135.0" y="407.0" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">QT prolongation</text><text x="1135.0" y="441.0" fill="#bb4148" font-size="26" font-weight="600" text-anchor="middle">Potential ventricular arrhythmia</text><path d="M1135,530 L1135,625" stroke="#bb4148" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="800" y="645" width="670" height="115" rx="18" fill="#edf6f5" stroke="none" stroke-width="2"/><text x="1135.0" y="694.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">Review ECG, electrolytes</text><text x="1135.0" y="728.5" fill="#17324d" font-size="26" font-weight="600" text-anchor="middle">and the medication combination</text><text x="60" y="850" fill="#536779" font-size="18" font-weight="400" text-anchor="start">Source: lesson.json, slide 17 • Qualitative schematic; no numerical risk score or diagnostic ECG</text></g></svg>